<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Toolkit - Professional Image Processing</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://docs.opencv.org/4.8.0/opencv.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #FAF8F3;
            --bg-secondary: #F2EDE4;
            --surface: #EDE8DF;
            --accent: #C4762A;
            --accent-deep: #8B4F1A;
            --text-primary: #1A1714;
            --text-secondary: #6B6159;
            --text-ghost: #B8AFA6;
            --border: rgba(26,23,20,0.1);
            
            --font-display: 'Playfair Display', serif;
            --font-body: 'Cormorant Garamond', serif;
            --font-micro: 'DM Sans', sans-serif;
        }

        html, body {
            height: 100%;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            font-family: var(--font-body);
        }

        body {
            line-height: 1.6;
        }

        #root {
            min-height: 100vh;
        }

        .vision-toolkit {
            min-height: 100vh;
            padding: clamp(2rem, 5vw, 4rem);
        }

        .header {
            text-align: center;
            margin-bottom: clamp(3rem, 8vw, 6rem);
        }

        .header__title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .header__subtitle {
            font-family: var(--font-micro);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-ghost);
            margin-bottom: 1rem;
        }

        .header__desc {
            font-family: var(--font-body);
            font-size: clamp(0.95rem, 1.2vw, 1.125rem);
            color: var(--text-secondary);
            max-width: 600px;
            margin: 1rem auto 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(2rem, 4vw, 4rem);
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: white;
            border-radius: 2px;
            padding: clamp(1.5rem, 3vw, 2.5rem);
            box-shadow: 0 2px 8px rgba(26, 23, 20, 0.06), 0 8px 32px rgba(26, 23, 20, 0.08);
            border: 1px solid var(--border);
        }

        .panel__title {
            font-family: var(--font-display);
            font-size: clamp(1.25rem, 3vw, 2rem);
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            font-weight: 600;
        }

        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 2px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.25, 0.1, 0.0, 1.0);
            background: var(--bg-primary);
            position: relative;
        }

        .upload-zone:hover {
            border-color: var(--accent);
            background: rgba(196, 118, 42, 0.02);
            transform: translateY(-2px);
        }

        .upload-zone input {
            display: none;
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 1rem;
            color: var(--accent);
            opacity: 0.7;
        }

        .upload-zone__text {
            font-family: var(--font-body);
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .canvas-wrapper {
            background: var(--bg-secondary);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            max-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .tab-button {
            font-family: var(--font-micro);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            background: none;
            border: none;
            color: var(--text-ghost);
            cursor: pointer;
            padding: 0.75rem 1rem;
            transition: all 0.5s cubic-bezier(0.25, 0.1, 0.0, 1.0);
            position: relative;
        }

        .tab-button.active {
            color: var(--accent);
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .control-group {
            margin-bottom: 1.5rem;
        }

        .control-label {
            font-family: var(--font-micro);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .slider-row {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .slider-row input[type="range"] {
            flex: 1;
        }

        .slider-value {
            font-family: var(--font-micro);
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 600;
            min-width: 50px;
            text-align: right;
        }

        input[type="range"],
        input[type="number"],
        input[type="text"],
        input[type="color"],
        select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 2px;
            font-family: var(--font-body);
            font-size: var(--font-body);
            background: white;
            color: var(--text-primary);
            transition: border-color 0.3s;
        }

        input[type="range"] {
            cursor: pointer;
            accent-color: var(--accent);
        }

        input[type="range"]:hover {
            border-color: var(--accent);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .info-card {
            background: var(--bg-primary);
            padding: 1rem;
            border-radius: 2px;
            border: 1px solid var(--border);
        }

        .info-label {
            font-family: var(--font-micro);
            font-size: 0.7rem;
            color: var(--text-ghost);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.35rem;
            font-weight: 500;
        }

        .info-value {
            font-family: var(--font-display);
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            word-break: break-word;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        button {
            font-family: var(--font-micro);
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.25, 0.1, 0.0, 1.0);
            font-weight: 500;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-deep);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139, 79, 26, 0.2);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--surface);
            border-color: var(--accent);
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .drawing-tools {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .drawing-tools button {
            padding: 0.6rem;
            font-size: 0.65rem;
        }

        .drawing-tools button.active {
            background: var(--accent);
            color: white;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 1.5rem 0;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            margin-bottom: 0.75rem;
        }

        .checkbox input {
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        .checkbox label {
            cursor: pointer;
            font-family: var(--font-body);
            font-size: var(--font-body);
        }

        .color-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .text-input-group {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.75rem;
        }

        .text-input-group input {
            flex: 1;
        }

        .text-input-group button {
            flex: 0;
        }

        .no-image {
            text-align: center;
            padding: 2rem;
            color: var(--text-ghost);
            font-family: var(--font-body);
        }

        .message {
            padding: 1rem;
            background: var(--bg-secondary);
            border-left: 4px solid var(--accent);
            border-radius: 2px;
            margin-bottom: 1rem;
            font-family: var(--font-micro);
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        function VisionToolkit() {
            const [image, setImage] = useState(null);
            const [imageInfo, setImageInfo] = useState(null);
            const [activeTab, setActiveTab] = useState('info');
            const [cvReady, setCvReady] = useState(false);
            
            const [filters, setFilters] = useState({
                grayscale: false,
                cannyLower: 100,
                cannyUpper: 200,
                gaussianKernel: 5,
                medianKernel: 5,
                binaryThreshold: 127,
                adaptiveBlockSize: 11,
                adaptiveC: 2,
                brightness: 0,
                contrast: 1,
                rotation: 0,
                resizePercent: 100,
            });

            const [drawingMode, setDrawingMode] = useState(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [drawColor, setDrawColor] = useState('#FF0000');
            const [drawThickness, setDrawThickness] = useState(2);
            const [textInput, setTextInput] = useState('');
            const [saveFileName, setSaveFileName] = useState('vision-toolkit-output');

            const canvasRef = useRef(null);
            const offscreenCanvasRef = useRef(null);
            const fileInputRef = useRef(null);

            // Check OpenCV readiness
            useEffect(() => {
                const checkCV = setInterval(() => {
                    if (typeof cv !== 'undefined' && cv.Mat) {
                        setCvReady(true);
                        clearInterval(checkCV);
                    }
                }, 100);
                return () => clearInterval(checkCV);
            }, []);

            const loadFile = (file) => {
                if (!file || !file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.onload = () => {
                        setImage(img);
                        setImageInfo({
                            width: img.width,
                            height: img.height,
                            resolution: `${img.width}×${img.height}`,
                            fileSize: (file.size / 1024).toFixed(2) + ' KB',
                            channels: 3,
                            format: file.type || 'image',
                        });
                        resetFilters();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleImageUpload = (e) => {
                loadFile(e.target.files[0]);
                e.target.value = '';
            };

            const handleDrop = (e) => {
                e.preventDefault();
                loadFile(e.dataTransfer.files[0]);
            };

            const updateBackup = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                if (!offscreenCanvasRef.current) {
                    offscreenCanvasRef.current = document.createElement('canvas');
                }
                offscreenCanvasRef.current.width = canvas.width;
                offscreenCanvasRef.current.height = canvas.height;
                const ctx = offscreenCanvasRef.current.getContext('2d');
                ctx.drawImage(canvas, 0, 0);
            };

            const processImage = () => {
                if (!image || !canvasRef.current || !cvReady) return;

                let src = cv.imread(image);
                let dst = src.clone();

                try {
                    // Resize if needed
                    if (filters.resizePercent !== 100) {
                        const scale = filters.resizePercent / 100;
                        const newWidth = Math.floor(src.cols * scale);
                        const newHeight = Math.floor(src.rows * scale);
                        cv.resize(dst, dst, new cv.Size(newWidth, newHeight));
                    }

                    // Grayscale
                    if (filters.grayscale) {
                        cv.cvtColor(dst, dst, cv.COLOR_RGBA2GRAY);
                        cv.cvtColor(dst, dst, cv.COLOR_GRAY2RGBA);
                    }

                    // Brightness and contrast
                    if (filters.brightness !== 0 || filters.contrast !== 1) {
                        dst.convertTo(dst, -1, filters.contrast, filters.brightness);
                    }

                    // Rotation
                    if (filters.rotation !== 0) {
                        const center = new cv.Point(dst.cols / 2, dst.rows / 2);
                        const rotationMatrix = cv.getRotationMatrix2D(center, filters.rotation, 1.0);
                        cv.warpAffine(dst, dst, rotationMatrix, new cv.Size(dst.cols, dst.rows));
                        rotationMatrix.delete();
                    }

                    cv.imshow(canvasRef.current, dst);
                    updateBackup();
                    dst.delete();
                    src.delete();
                } catch (error) {
                    console.error('Processing error:', error);
                }
            };

            // Re-process whenever filters change
            useEffect(() => {
                if (image && cvReady) {
                    processImage();
                }
            }, [filters, image, cvReady]);

            const applyFilter = (filterName) => {
                if (!image || !cvReady || !canvasRef.current) return;

                let sourceCanvas = offscreenCanvasRef.current || canvasRef.current;
                let src = cv.imread(sourceCanvas);
                let dst = new cv.Mat();

                try {
                    switch (filterName) {
                        case 'canny': {
                            let gray = new cv.Mat();
                            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                            cv.Canny(gray, dst, filters.cannyLower, filters.cannyUpper);
                            cv.cvtColor(dst, dst, cv.COLOR_GRAY2RGBA);
                            gray.delete();
                            break;
                        }
                        case 'gaussian': {
                            let ksize = Math.min(filters.gaussianKernel * 2 + 1, Math.min(src.rows, src.cols));
                            cv.GaussianBlur(src, dst, new cv.Size(ksize, ksize), 0);
                            break;
                        }
                        case 'median': {
                            let ksize = Math.min(filters.medianKernel * 2 + 1, Math.min(src.rows, src.cols));
                            cv.medianBlur(src, dst, ksize);
                            break;
                        }
                        case 'binary': {
                            let gray = new cv.Mat();
                            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                            cv.threshold(gray, dst, filters.binaryThreshold, 255, cv.THRESH_BINARY);
                            cv.cvtColor(dst, dst, cv.COLOR_GRAY2RGBA);
                            gray.delete();
                            break;
                        }
                        case 'adaptive': {
                            let gray = new cv.Mat();
                            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                            let blockSize = Math.min(filters.adaptiveBlockSize * 2 + 1, Math.min(src.rows, src.cols));
                            if (blockSize % 2 === 0) blockSize++;
                            cv.adaptiveThreshold(gray, dst, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, blockSize, filters.adaptiveC);
                            cv.cvtColor(dst, dst, cv.COLOR_GRAY2RGBA);
                            gray.delete();
                            break;
                        }
                        default:
                            dst = src.clone();
                    }

                    cv.imshow(canvasRef.current, dst);
                    updateBackup();
                    dst.delete();
                } catch (error) {
                    console.error('Filter error:', error);
                }
                src.delete();
            };

            const getCanvasPoint = (canvas, e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            };

            const startDrawing = (e) => {
                if (activeTab !== 'draw' || !drawingMode || !canvasRef.current) return;
                setIsDrawing(true);
                const canvas = canvasRef.current;
                canvas.startPoint = getCanvasPoint(canvas, e);
                // Snapshot everything drawn so far so it isn't lost during this stroke
                const ctx = canvas.getContext('2d');
                canvas.snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
            };

            const draw = (e) => {
                if (activeTab !== 'draw' || !isDrawing || !drawingMode || !canvasRef.current) return;
                
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const { x, y } = getCanvasPoint(canvas, e);

                // Restore prior content (previous shapes/text) before drawing the preview
                if (canvas.snapshot) {
                    ctx.putImageData(canvas.snapshot, 0, 0);
                }

                ctx.strokeStyle = drawColor;
                ctx.fillStyle = drawColor;
                ctx.lineWidth = drawThickness;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                const start = canvas.startPoint;

                switch (drawingMode) {
                    case 'line':
                        ctx.beginPath();
                        ctx.moveTo(start.x, start.y);
                        ctx.lineTo(x, y);
                        ctx.stroke();
                        break;
                    case 'rectangle':
                        ctx.strokeRect(start.x, start.y, x - start.x, y - start.y);
                        break;
                    case 'circle': {
                        const radius = Math.sqrt(Math.pow(x - start.x, 2) + Math.pow(y - start.y, 2));
                        ctx.beginPath();
                        ctx.arc(start.x, start.y, radius, 0, 2 * Math.PI);
                        ctx.stroke();
                        break;
                    }
                    default:
                        break;
                }
            };

            const addText = () => {
                if (!canvasRef.current || !textInput) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = drawColor;
                ctx.font = `${drawThickness * 8}px Arial`;
                ctx.fillText(textInput, 20, 40);
                setTextInput('');
            };

            const saveImage = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                const name = saveFileName.trim() || 'vision-toolkit-output';
                link.download = name.toLowerCase().endsWith('.png') ? name : `${name}.png`;
                link.click();
            };

            const resetFilters = () => {
                setFilters({
                    grayscale: false,
                    cannyLower: 100,
                    cannyUpper: 200,
                    gaussianKernel: 5,
                    medianKernel: 5,
                    binaryThreshold: 127,
                    adaptiveBlockSize: 11,
                    adaptiveC: 2,
                    brightness: 0,
                    contrast: 1,
                    rotation: 0,
                    resizePercent: 100,
                });
                setDrawingMode(null);
            };

            const resetDrawings = () => {
                if (!canvasRef.current || !offscreenCanvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(offscreenCanvasRef.current, 0, 0);
            };

            return (
                <div className="vision-toolkit">
                    <div className="header">
                        <div className="header__subtitle">Professional Image Processing</div>
                        <h1 className="header__title">Vision Toolkit</h1>
                        <p className="header__desc">
                            Advanced image processing with filters, effects, and drawing tools
                        </p>
                    </div>

                    <div className="container">
                        {/* Left Panel - Image Display */}
                        <div className="panel">
                            <h2 className="panel__title">Canvas</h2>
                            
                            <input
                                ref={fileInputRef}
                                type="file"
                                accept="image/*"
                                style={{ display: 'none' }}
                                onChange={handleImageUpload}
                            />
                            {!image ? (
                                <div 
                                    className="upload-zone"
                                    onClick={() => fileInputRef.current?.click()}
                                    onDragOver={(e) => e.preventDefault()}
                                    onDrop={handleDrop}
                                >
                                    <svg className="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                        <polyline points="17 8 12 3 7 8"></polyline>
                                        <line x1="12" y1="3" x2="12" y2="15"></line>
                                    </svg>
                                    <p className="upload-zone__text">Upload Your Image</p>
                                    <p className="upload-zone__hint">Click to select or drag and drop</p>
                                </div>
                            ) : (
                                <div>
                                    <div className="canvas-wrapper">
                                        <canvas 
                                            ref={canvasRef} 
                                            width={imageInfo?.width}
                                            height={imageInfo?.height}
                                            onMouseDown={startDrawing}
                                            onMouseMove={draw}
                                            onMouseUp={() => setIsDrawing(false)}
                                            onMouseLeave={() => setIsDrawing(false)}
                                            style={{ cursor: drawingMode && activeTab === 'draw' ? 'crosshair' : 'default' }}
                                        ></canvas>
                                    </div>
                                    <div className="control-group">
                                        <label className="control-label">Export Filename</label>
                                        <input 
                                            type="text" 
                                            placeholder="vision-toolkit-output"
                                            value={saveFileName}
                                            onChange={(e) => setSaveFileName(e.target.value)}
                                        />
                                    </div>
                                </div>
                            )}

                            <div className="button-group">
                                <button 
                                    className="btn-primary"
                                    onClick={() => fileInputRef.current?.click()}
                                >
                                    <span className="btn-icon">
                                        📤 New Image
                                    </span>
                                </button>
                                <button 
                                    className="btn-primary"
                                    onClick={saveImage}
                                    disabled={!image}
                                >
                                    <span className="btn-icon">
                                        💾 Save
                                    </span>
                                </button>
                            </div>
                        </div>

                        {/* Right Panel - Controls */}
                        <div className="panel">
                            {!image ? (
                                <div className="no-image">
                                    <p>Upload an image to get started</p>
                                </div>
                            ) : (
                                <>
                                    <div className="tabs">
                                        <button 
                                            className={`tab-button ${activeTab === 'info' ? 'active' : ''}`}
                                            onClick={() => setActiveTab('info')}
                                        >
                                            Info
                                        </button>
                                        <button 
                                            className={`tab-button ${activeTab === 'filters' ? 'active' : ''}`}
                                            onClick={() => setActiveTab('filters')}
                                        >
                                            Filters
                                        </button>
                                        <button 
                                            className={`tab-button ${activeTab === 'adjust' ? 'active' : ''}`}
                                            onClick={() => setActiveTab('adjust')}
                                        >
                                            Adjust
                                        </button>
                                        <button 
                                            className={`tab-button ${activeTab === 'draw' ? 'active' : ''}`}
                                            onClick={() => setActiveTab('draw')}
                                        >
                                            Draw
                                        </button>
                                    </div>

                                    {/* Info Tab */}
                                    <div className={`tab-content ${activeTab === 'info' ? 'active' : ''}`}>
                                        <div className="info-grid">
                                            <div className="info-card">
                                                <div className="info-label">Width</div>
                                                <div className="info-value">{imageInfo?.width}px</div>
                                            </div>
                                            <div className="info-card">
                                                <div className="info-label">Height</div>
                                                <div className="info-value">{imageInfo?.height}px</div>
                                            </div>
                                            <div className="info-card">
                                                <div className="info-label">Resolution</div>
                                                <div className="info-value">{imageInfo?.resolution}</div>
                                            </div>
                                            <div className="info-card">
                                                <div className="info-label">File Size</div>
                                                <div className="info-value">{imageInfo?.fileSize}</div>
                                            </div>
                                            <div className="info-card">
                                                <div className="info-label">Channels</div>
                                                <div className="info-value">{imageInfo?.channels}</div>
                                            </div>
                                            <div className="info-card">
                                                <div className="info-label">Format</div>
                                                <div className="info-value">{imageInfo?.format}</div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Filters Tab */}
                                    <div className={`tab-content ${activeTab === 'filters' ? 'active' : ''}`}>
                                        <div className="control-group">
                                            <div className="checkbox">
                                                <input
                                                    type="checkbox"
                                                    id="grayscale"
                                                    checked={filters.grayscale}
                                                    onChange={(e) => setFilters({...filters, grayscale: e.target.checked})}
                                                />
                                                <label htmlFor="grayscale">Grayscale</label>
                                            </div>
                                        </div>

                                        <div className="divider"></div>

                                        <div className="control-group">
                                            <label className="control-label">Canny Edge Detection</label>
                                            <div className="slider-row">
                                                <span className="control-label">Lower Threshold:</span>
                                                <input
                                                    type="range"
                                                    min="0"
                                                    max="255"
                                                    value={filters.cannyLower}
                                                    onChange={(e) => setFilters({...filters, cannyLower: parseInt(e.target.value)})}
                                                />
                                                <span className="slider-value">{filters.cannyLower}</span>
                                            </div>
                                            <div className="slider-row" style={{ marginTop: '0.75rem' }}>
                                                <span className="control-label">Upper Threshold:</span>
                                                <input
                                                    type="range"
                                                    min="0"
                                                    max="255"
                                                    value={filters.cannyUpper}
                                                    onChange={(e) => setFilters({...filters, cannyUpper: parseInt(e.target.value)})}
                                                />
                                                <span className="slider-value">{filters.cannyUpper}</span>
                                            </div>
                                            <button 
                                                className="btn-secondary"
                                                onClick={() => applyFilter('canny')}
                                                style={{ marginTop: '0.75rem', width: '100%' }}
                                            >
                                                Apply Canny
                                            </button>
                                        </div>

                                        <div className="divider"></div>

                                        <div className="control-group">
                                            <label className="control-label">Gaussian Blur</label>
                                            <div className="slider-row">
                                                <input
                                                    type="range"
                                                    min="1"
                                                    max="20"
                                                    value={filters.gaussianKernel}
                                                    onChange={(e) => setFilters({...filters, gaussianKernel: parseInt(e.target.value)})}
                                                />
                                                <span className="slider-value">{filters.gaussianKernel}</span>
                                            </div>
                                            <button 
                                                className="btn-secondary"
                                                onClick={() => applyFilter('gaussian')}
                                                style={{ marginTop: '0.75rem', width: '100%' }}
                                            >
                                                Apply Gaussian
                                            </button>
                                        </div>

                                        <div className="divider"></div>

                                        <div className="control-group">
                                            <label className="control-label">Median Blur</label>
                                            <div className="slider-row">
                                                <input
                                                    type="range"
                                                    min="1"
                                                    max="20"
                                                    value={filters.medianKernel}
                                                    onChange={(e) => setFilters({...filters, medianKernel: parseInt(e.target.value)})}
                                                />
                                                <span className="slider-value">{filters.medianKernel}</span>
                                            </div>
                                            <button 
                                                className="btn-secondary"
                                                onClick={() => applyFilter('median')}
                                                style={{ marginTop: '0.75rem', width: '100%' }}
                                            >
                                                Apply Median
                                            </button>
                                        </div>

                                        <div className="divider"></div>

                                        <div className="control-group">
                                            <label className="control-label">Binary Threshold</label>
                                            <div className="slider-row">
                                                <input
                                                    type="range"
                                                    min="0"
                                                    max="255"
                                                    value={filters.binaryThreshold}
                                                    onChange={(e) => setFilters({...filters, binaryThreshold: parseInt(e.target.value)})}
                                                />
                                                <span className="slider-value">{filters.binaryThreshold}</span>
                                            </div>
                                            <button 
                                                className="btn-secondary"
                                                onClick={() => applyFilter('binary')}
                                                style={{ marginTop: '0.75rem', width: '100%' }}
                                            >
                                                Apply Binary
                                            </button>
                                        </div>

                                        <div className="divider"></div>

                                        <div className="control-group">
                                            <label className="control-label">Adaptive Threshold</label>
                                            <div className="slider-row">
                                                <span className="control-label">Block Size:</span>
                                                <input
                                                    type="range"
                                                    min="1"
                                                    max="20"
                                                    value={filters.adaptiveBlockSize}
                                                    onChange={(e) => setFilters({...filters, adaptiveBlockSize: parseInt(e.target.value)})}
                                                />
                                                <span className="slider-value">{filters.adaptiveBlockSize}</span>
                                            </div>
                                            <div className="slider-row" style={{ marginTop: '0.75rem' }}>
                                                <span className="control-label">Constant C:</span>
                                                <input
                                                    type="range"
                                                    min="0"
                                                    max="20"
                                                    value={filters.adaptiveC}
                                                    onChange={(e) => setFilters({...filters, adaptiveC: parseInt(e.target.value)})}
                                                />
                                                <span className="slider-value">{filters.adaptiveC}</span>
                                            </div>
                                            <button 
                                                className="btn-secondary"
                                                onClick={() => applyFilter('adaptive')}
                                                style={{ marginTop: '0.75rem', width: '100%' }}
                                            >
                                                Apply Adaptive
                                            </button>
                                        </div>

                                        <div className="divider"></div>

                                        <button 
                                            className="btn-secondary"
                                            onClick={resetFilters}
                                            style={{ width: '100%' }}
                                        >
                                            ↻ Reset Changes
                                        </button>
                                    </div>

                                    {/* Adjust Tab */}
                                    <div className={`tab-content ${activeTab === 'adjust' ? 'active' : ''}`}>
                                        <div className="control-group">
                                            <label className="control-label">Brightness</label>
                                            <div className="slider-row">
                                                <input
                                                    type="range"
                                                    min="-100"
                                                    max="100"
                                                    value={filters.brightness}
                                                    onChange={(e) => setFilters({...filters, brightness: parseInt(e.target.value)})}
                                                />
                                                <span className="slider-value">{filters.brightness}</span>
                                            </div>
                                        </div>

                                        <div className="control-group">
                                            <label className="control-label">Contrast</label>
                                            <div className="slider-row">
                                                <input
                                                    type="range"
                                                    min="0.5"
                                                    max="2"
                                                    step="0.1"
                                                    value={filters.contrast}
                                                    onChange={(e) => setFilters({...filters, contrast: parseFloat(e.target.value)})}
                                                />
                                                <span className="slider-value">{filters.contrast.toFixed(1)}</span>
                                            </div>
                                        </div>

                                        <div className="control-group">
                                            <label className="control-label">Rotation (degrees)</label>
                                            <div className="slider-row">
                                                <input
                                                    type="range"
                                                    min="0"
                                                    max="360"
                                                    value={filters.rotation}
                                                    onChange={(e) => setFilters({...filters, rotation: parseInt(e.target.value)})}
                                                />
                                                <span className="slider-value">{filters.rotation}°</span>
                                            </div>
                                        </div>

                                        <div className="control-group">
                                            <label className="control-label">Resize (%)</label>
                                            <div className="slider-row">
                                                <input
                                                    type="range"
                                                    min="10"
                                                    max="200"
                                                    value={filters.resizePercent}
                                                    onChange={(e) => setFilters({...filters, resizePercent: parseInt(e.target.value)})}
                                                />
                                                <span className="slider-value">{filters.resizePercent}%</span>
                                            </div>
                                        </div>

                                        <button 
                                            className="btn-secondary"
                                            onClick={resetFilters}
                                            style={{ width: '100%', marginTop: '1rem' }}
                                        >
                                            ↻ Reset All
                                        </button>
                                    </div>

                                    {/* Draw Tab */}
                                    <div className={`tab-content ${activeTab === 'draw' ? 'active' : ''}`}>
                                        <label className="control-label">Drawing Tools</label>
                                        <div className="drawing-tools">
                                            <button 
                                                className={`btn-secondary ${drawingMode === 'line' ? 'active' : ''}`}
                                                onClick={() => setDrawingMode(drawingMode === 'line' ? null : 'line')}
                                            >
                                                ✏️ Line
                                            </button>
                                            <button 
                                                className={`btn-secondary ${drawingMode === 'rectangle' ? 'active' : ''}`}
                                                onClick={() => setDrawingMode(drawingMode === 'rectangle' ? null : 'rectangle')}
                                            >
                                                ◻️ Rectangle
                                            </button>
                                            <button 
                                                className={`btn-secondary ${drawingMode === 'circle' ? 'active' : ''}`}
                                                onClick={() => setDrawingMode(drawingMode === 'circle' ? null : 'circle')}
                                            >
                                                ○ Circle
                                            </button>
                                            <button 
                                                className={`btn-secondary`}
                                                onClick={() => setDrawingMode(null)}
                                            >
                                                ✓ Done
                                            </button>
                                        </div>

                                        <div className="divider"></div>

                                        <div className="control-group">
                                            <label className="control-label">Color</label>
                                            <input 
                                                type="color" 
                                                value={drawColor}
                                                onChange={(e) => setDrawColor(e.target.value)}
                                            />
                                        </div>

                                        <div className="control-group">
                                            <label className="control-label">Thickness</label>
                                            <div className="slider-row">
                                                <input
                                                    type="range"
                                                    min="1"
                                                    max="20"
                                                    value={drawThickness}
                                                    onChange={(e) => setDrawThickness(parseInt(e.target.value))}
                                                />
                                                <span className="slider-value">{drawThickness}</span>
                                            </div>
                                        </div>

                                        <div className="divider"></div>

                                        <div className="control-group">
                                            <label className="control-label">Add Text</label>
                                            <div className="text-input-group">
                                                <input
                                                    type="text"
                                                    placeholder="Enter text"
                                                    value={textInput}
                                                    onChange={(e) => setTextInput(e.target.value)}
                                                    onKeyPress={(e) => e.key === 'Enter' && addText()}
                                                />
                                                <button 
                                                    className="btn-secondary"
                                                    onClick={addText}
                                                >
                                                    Add
                                                </button>
                                            </div>
                                        </div>

                                        <div className="divider"></div>

                                        <button 
                                            className="btn-secondary"
                                            onClick={resetDrawings}
                                            style={{ width: '100%' }}
                                        >
                                            ↺ Reset Drawings
                                        </button>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<VisionToolkit />, document.getElementById('root'));
    </script>
</body>
</html>
